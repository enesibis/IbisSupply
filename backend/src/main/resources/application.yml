spring:
  application:
    name: ibissupply-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ibissupply
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ibissupply-secret-key-minimum-256-bits-long-for-hs256}
  expiration: 900000        # 15 minutes in ms
  refresh-expiration: 604800000  # 7 days in ms

logging:
  level:
    com.ibissupply: DEBUG
    org.springframework.security: WARN
    org.web3j: WARN

ai:
  enabled: false          # python main.py başlatılınca true yap
  base-url: http://localhost:8000

blockchain:
  enabled: false          # Hardhat deploy sonrası true yap
  rpc-url: http://localhost:8545
  chain-id: 31337
  # Hardhat varsayılan account #0 private key (lokal geliştirme için)
  private-key: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
  addresses:
    batch-registry: ""    # deploy.js çalıştırınca deployed-addresses.json'dan al
    shipment-registry: ""
    quality-registry: ""
