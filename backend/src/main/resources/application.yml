spring:
  application:
    name: ibissupply-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ibissupply
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ibissupply-secret-key-minimum-256-bits-long-for-hs256}
  expiration: 900000        # 15 minutes in ms
  refresh-expiration: 604800000  # 7 days in ms

logging:
  level:
    com.ibissupply: DEBUG
    org.springframework.security: WARN
    org.web3j: WARN

ai:
  enabled: true
  base-url: http://localhost:8000

groq:
  api-key: ${GROQ_API_KEY:}

blockchain:
  enabled: true
  rpc-url: http://localhost:8545
  chain-id: 31337
  private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  addresses:
    batch-registry: "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"
    shipment-registry: "0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE"
    quality-registry: "0x68B1D87F95878fE05B998F19b66F4baba5De1aed"
    farm-registry: "0x3Aa5ebB10DC797CAC828524e59A333d0A371443c"
    certificate-nft: "0xc6e7DF5E7b4f2A278906862b61205850344D4e7d"
